site_name: "Iron Bank Training"
site_description: "12-Month Cloud Security & AppSec Mastery Plan"
site_url: ""

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  font:
    text: DM Sans
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    logo: material/shield-lock
    admonition:
      tip: material/lightbulb-on
      warning: material/alert
      danger: material/fire
      info: material/information
      abstract: material/broom
      note: material/pencil
      example: material/test-tube
      quote: material/format-quote-close

